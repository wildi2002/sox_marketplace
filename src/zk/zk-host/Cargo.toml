[package]
name = "zk-host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zk-host"
path = "src/main.rs"

[dependencies]
sp1-sdk = { version = "4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
bincode = "1"
zk-common = { path = "../zk-common" }
